# cross-rs container tweaks: the default aarch64 image lacks target-arch ALSA
# headers, which cpal's alsa-sys needs (see .github/workflows/release.yml).
[target.aarch64-unknown-linux-gnu]
pre-build = [
	"dpkg --add-architecture $CROSS_DEB_ARCH",
	"apt-get update && apt-get --assume-yes install libasound2-dev:$CROSS_DEB_ARCH",
]
